<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatora AI - Next-Gen AI Assistant</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo-main.png" />

  <!-- Google Fonts: Plus Jakarta Sans & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Three.js + FBXLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Emoji Picker -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>

  <!-- Marked Markdown Parser & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <!-- Floating Top Navigation / Control Bar -->
  <header class="app-topbar">
    <div class="brand-logo">
      <div class="logo-icon-wrapper">
        <img src="assets/logo-main.png" alt="Chatora AI" class="brand-img" onerror="this.style.display='none'" />
        <span class="logo-fallback-icon">🤖</span>
      </div>
      <div class="brand-text-group">
        <span class="brand-title">Chatora<span class="gradient-text">AI</span></span>
        <span class="brand-badge">v2.0</span>
      </div>
    </div>

    <div class="topbar-actions">
      <div class="status-indicator-pill">
        <span class="status-dot pulsing"></span>
        <span class="status-text">AI Online</span>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <div class="main-container">
    <!-- History Sidebar -->
    <aside class="history-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-group">
          <svg class="sidebar-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <h3>Conversations</h3>
        </div>
        <button id="new-chat-btn" class="new-chat-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New Chat</span>
        </button>
      </div>

      <div id="history-list" class="history-list-container"></div>

      <div class="sidebar-profile">
        <button id="profile-btn" class="profile-btn">
          <div class="profile-avatar-mini">
            <span id="profile-initial-mini">👤</span>
          </div>
          <span id="profile-name" class="profile-name-text">My Profile</span>
          <svg class="dropdown-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <div id="profile-dropdown" class="profile-dropdown">
          <button id="view-profile-btn" class="dropdown-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>View Profile</span>
          </button>
          <div class="dropdown-divider"></div>
          <button id="logout-btn" class="dropdown-item danger">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 3D Avatar Viewport Section -->
    <section class="avatar-section">
      <div class="avatar-card-frame">
        <div class="avatar-frame-header">
          <span class="live-badge"><span class="badge-dot"></span> 3D Companion</span>
          <span class="avatar-hint">Interactive Mode</span>
        </div>
        <div id="avatar-container"></div>
      </div>
    </section>

    <!-- Main Chat Section -->
    <section class="chat-section">
      <div class="chat-header">
        <div class="chat-title-wrapper">
          <span class="chat-bot-icon">🤖</span>
          <div>
            <h2>Chatora AI Assistant</h2>
            <p class="chat-subtitle">Powered by Sewak Meghwal</p>
          </div>
        </div>
      </div>

      <!-- Chat Messages Container -->
      <div id="chat-box" class="chat-box-container"></div>

      <!-- Floating Input Bar -->
      <div class="input-area-wrapper">
        <div class="input-area">
          <button id="emoji-btn" type="button" class="icon-action-btn" title="Add Emoji">
            😊
          </button>
          <input type="text" id="user-input" placeholder="Ask Chatora AI anything..." autocomplete="off" />
          <button id="voice-btn" type="button" class="icon-action-btn voice-btn" title="Voice Input">
            🎤
          </button>
          <button id="send-btn" type="button" class="send-action-btn">
            <span>Send</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>

        <!-- Emoji Picker Popover -->
        <emoji-picker id="emoji-picker" class="emoji-picker-popover" style="display:none;"></emoji-picker>
      </div>
    </section>
  </div>

  <!-- Floating Toast Notification -->
  <div id="toast" class="toast">
    <span class="toast-icon">✨</span>
    <span class="toast-message">Copied Successfully!</span>
  </div>

  <script src="js/app.js?v=5"></script>
</body>

</html>
