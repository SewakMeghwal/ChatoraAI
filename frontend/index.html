<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatoraAI🤖</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/cat.png" />

  <!-- Three.js + FBXLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Emoji Picker -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>

  <!-- mark tag -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="theme-toggle">🌙</button>

  <div class="main-container">
    <div class="history-sidebar">
      <h3>History</h3>
      <button id="new-chat-btn" style="
        width:100%;
        padding:8px;
        margin-bottom:10px;
        border-radius:8px;
        border:none;
        background:#00eaff;
        color:black;
        font-weight:bold;
        cursor:pointer;">
        ➕ New Chat
      </button>
      <div id="history-list"></div>
      <div class="sidebar-profile">
        <button id="profile-btn" class="profile-btn">
          👤 <span id="profile-name">My Profile</span>
        </button>

        <div id="profile-dropdown" class="profile-dropdown">
          <button id="view-profile-btn">👤 View Profile</button>
          <button id="logout-btn">🚪 Logout</button>
        </div>
      </div>
    </div>
    <!-- Avatar Section -->
    <div class="avatar-section">
      <div id="avatar-container"></div>
    </div>

    <!-- Chat Section -->
    <div class="chat-section">
      <h1>ChatoraAI🤖</h1>

      <!-- Chat Box -->
      <div id="chat-box"></div>

      <!-- Input Area -->
      <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." />
        <button id="emoji-btn" type="button">😊</button>
        <button id="voice-btn" type="button">🎤</button>
        <button id="send-btn" type="button">Send</button>
      </div>

      <!-- Emoji Picker -->
      <emoji-picker id="emoji-picker" style="display:none;"></emoji-picker>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Copied Successfully ✅</div>
  <script src="js/app.js"></script>
</body>

</html>
