<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chatora AI</title>
  <link rel="icon" type="image/png" href="assets/logo-main.png" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <div class="auth-page-wrapper">
    <div class="auth-background-glow"></div>

    <div class="auth-container">
      <div class="auth-header">
        <div class="auth-brand-icon">🤖</div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue your AI conversations</p>
      </div>

      <div class="auth-form-group">
        <div class="input-field-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
        </div>

        <div class="input-field-wrapper password-input-group">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
          <button type="button" class="toggle-password" data-target="login-password" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <button class="auth-submit-btn" onclick="login()">
        <span>Sign In</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Create one</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>

</html>
