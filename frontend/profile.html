<!doctype html>
<html><head>
  <meta charset="utf-8" /><title>Profile - ChatoraAI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head><body>
  <div style="max-width:700px;margin:70px auto;padding:18px;background:var(--panel);border-radius:12px;">
    <h2 style="color:var(--accent)">Profile</h2>
    <div id="profileContent"><p class="small-muted">Loading...</p></div>
    <div style="margin-top:12px"><a href="index.html" class="small-link">Back to chat</a></div>
  </div>

  <script src="script.js"></script>
  <script>
    async function loadProfile(){
      const token = localStorage.getItem('chatora_token');
      if(!token){ document.getElementById('profileContent').innerHTML = '<p class="small-muted">Not logged in.</p>'; return; }
      try{
        const res = await fetch(AUTH_ME, { headers: authHeaders() });
        if(!res.ok){ throw new Error('Failed'); }
        const user = await res.json();
        document.getElementById('profileContent').innerHTML = `<div class="small-muted">Username: <strong>${user.username}</strong></div><div class="small-muted">Email: <strong>${user.email}</strong></div><div style="margin-top:10px"><button id="logoutBtn" class="icon">Logout</button></div>`;
        document.getElementById('logoutBtn').addEventListener('click', ()=>{ clearAuth(); window.location.href='index.html';});
      }catch(err){ document.getElementById('profileContent').innerHTML = '<p class="small-muted">Error loading profile.</p>'; console.error(err); }
    }
    loadProfile();
  </script>
</body></html>
